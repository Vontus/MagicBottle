name: MagicBottle

main: vontus.magicbottle.Plugin
version: ${version}
api-version: '26.2'
author: Vontus

libraries:
  - org.spongepowered:configurate-yaml:4.2.0

permissions:
  magicbottle.action.craft:
    description: 'Allows a player to craft MagicBottles and see their recipe'
    default: true
  magicbottle.action.deposit:
    description: 'Allows a player to save experience in MagicBottles'
    default: true
  magicbottle.action.withdraw:
    description: 'Allows a player to take experience from MagicBottles'
    default: true
  magicbottle.action.repair:
    description: 'Allows a player to repair tools and armor in the anvil using a MagicBottle'
    default: true
  magicbottle.upgrade.autorepair:
    description: 'Allows a player to apply the repair (auto-repair) upgrade to a MagicBottle in the smithing table'
    default: true
  magicbottle.upgrade.collect:
    description: 'Allows a player to apply the collect upgrade (stores picked up XP orbs) to a MagicBottle in the smithing table'
    default: true
  magicbottle.command.give:
    description: 'Admin command. Gives you or another player a number of bottles of a certain level'
  magicbottle.command.reload:
    description: 'Admin command. Reloads the plugin config'
  magicbottle.maxlevel.unlimited:
    description: 'Allows a player to save up to 20,000 levels in a single MagicBottle'
    default: false
  magicbottle.action.deposit.cost.exempt:
    description: 'Exempts the player from paying the cost of saving experience into a bottle'
    default: false
