bottle text:
  name: "<dark_purple><bold>MagicBottle</bold> <gray>| <yellow>Nivel <level>/<max_level> <gray>| <xpbar>"
  name full: "<dark_purple><bold>MagicBottle</bold> <gray>| <gold>Nivel <level> ✦ <gray>| <xpbar>"
  filled bar: "<dark_purple>|"
  empty bar: "<yellow>|"
  experience text: "<dark_purple>Puntos de experiencia:"
  experience: " <yellow><points><gray>/<max_points>"
  capacity text: "<dark_purple>Capacidad:"
  capacity: " <yellow>Nivel <max_level> <gray>(×<size>)"
  upgrades title: "<dark_purple>Mejoras <gray>(barra rápida/mano secundaria)<dark_purple>:"
  upgrades:
    autorepair: " <yellow>Auto-reparación: <gray>repara tus objetos mientras los usas."
    collect: " <yellow>Recolección: <gray>guarda los orbes de experiencia que recoges."
    soulbound: " <yellow>Ligada al alma: <gray>conservas la botella cuando mueres."
  upgrade disabled: "<dark_gray><st><upgrade></st>"
  upgrade preview: "<green>+</green><upgrade>"
  lore:
    - "<light_purple>Cómo se usa: /magicbottle guide"
messages:
  max level reached: "<red>El nivel máximo que puede contener esta MagicBottle es <level>."
  nothing to store: "<red>Es muy poca experiencia para guardar algo tras el coste del depósito."
  unauthorized:
    deposit: "<red>No tienes permiso para guardar experiencia."
    withdraw: "<red>No tienes permiso para sacar experiencia."
  commands:
    reload completed: "<yellow>Configuración recargada."
    given bottle: "<yellow>Se dieron <amount> MagicBottle(s) a <player> con <level> niveles."
    given bottles: "<yellow>Se dieron <amount> MagicBottle(s) a <players> jugadores con <level> niveles."
    upgrade no bottle: "<red>Sostén una MagicBottle en la mano principal."
    upgrade stack: "<red>Sostén una sola MagicBottle, no una pila."
    upgrades changed: "<yellow>Botella mejorada. Ahora tiene: <upgrades>"
    upgrades unchanged: "<yellow>No cambió nada. La botella tiene: <upgrades>"
    upgrades none: "ninguna"
  recipe:
    title: "<dark_purple>Receta de MagicBottle"
    disabled: "<red>No hay ninguna receta de MagicBottle que puedas usar."
    arrow: "<gray>Hace"
  guide:
    title: "<gold>Guía de MagicBottle"
    intro: "<gray>Elige un tema."
    back: "<gray>« Volver"
    recipe: "Receta"
    link: "Abrir la página del plugin"
    hand:
      title: "En la mano"
      text:
        - "Con la botella en la mano, el <yellow>clic izquierdo</yellow> guarda tus niveles en ella y el <yellow>clic derecho</yellow> los saca. Cada clic mueve 1 nivel; con <yellow>Shift</yellow>, 10. Una botella llena no admite más."
    hand cost: "Guardar cuesta un <yellow><percent>%</yellow>: la botella se queda con menos de lo que pierdes."
    hand grid: "Para mover <yellow>toda</yellow> la experiencia de golpe, pon la botella sola en una cuadrícula de crafteo (vale la de 2x2 del inventario) y coge el resultado."
    upgrades:
      title: "Mejoras"
      text:
        - "Las mejoras se aplican en la <yellow>mesa de herrería</yellow>, sin plantilla: la botella en la casilla base y el ingrediente de abajo en la de adición. La botella conserva su experiencia."
        - "Una mejora solo funciona mientras la botella está en tu <yellow>barra de acceso rápido</yellow> o en la <yellow>mano secundaria</yellow>. Sácala de ahí para apagarla."
    capacity:
      title: "Capacidad y fusión"
      text:
        - "Una botella llena guarda hasta el <yellow>Nivel <level></yellow>. Una botella más grande muestra <yellow>(×2)</yellow> en su descripción: equivale a dos botellas y guarda hasta el <yellow>Nivel <merged_level></yellow>."
        - "En el <yellow>yunque</yellow>, dos botellas <yellow>llenas</yellow> se fusionan en una con sus tamaños sumados y las mejoras de ambas."
    costs:
      title: "Pagar costes"
      text:
        - "Cuando algo en el <yellow>yunque</yellow> o en la <yellow>mesa de encantamientos</yellow> cuesta más niveles de los que tienes, una botella de tu inventario paga el resto. Tu propia experiencia se gasta primero."
        - "Solo se le quita a la botella lo que se gasta."
    repair:
      title: "Reparar"
      text:
        - "En el <yellow>yunque</yellow>, pon un objeto dañado en la primera casilla y una botella con experiencia en la segunda para repararlo con la experiencia de la botella, sin coste de niveles. 1 de experiencia repara 2 puntos de durabilidad, como Reparación."
        - "La mejora de <yellow>auto-reparación</yellow> repara los objetos que usas mientras la botella está en tu barra de acceso rápido o en la mano secundaria."
    repair enchantment: "Solo se pueden reparar objetos con <yellow><enchantment></yellow>."
    about:
      title: "Acerca de"
      text:
        - "<gold><name> de Vontus"
        - "<yellow><click:open_url:'https://github.com/Vontus/MagicBottle'>https://github.com/Vontus/MagicBottle</click>"
  repair:
    auto spent: "<yellow>Reparación <dark_purple>-<xp></dark_purple> XP"
    anvil cost: "<gray>Usa <yellow><xp></yellow> XP de la botella (quedan <yellow><xp_left></yellow> XP)"
  merge:
    anvil: "<red>Consume <yellow><xp></yellow> XP de las dos botellas"
  spend:
    from bottle: "<gray>Tu MagicBottle cubrió el yunque: <yellow>-<xp> XP</yellow>"
    enchant: "<gray>Tu MagicBottle cubrió el encantamiento: <yellow>-<xp> XP</yellow>"
  collect:
    stored: "<yellow>Recolectado <dark_purple>+<xp></dark_purple> XP"
  feedback separator: " <gray>| "
